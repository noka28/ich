<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Über mich</title>
  <style>
    /* Box-sizing für alle Elemente */
    * {
      box-sizing: border-box;
    }

    /* HTML und Body auf volle Höhe und Breite, ohne Ränder */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100svh; /* volle Bildschirmhöhe */
      background-color: black;
    }

    /* Hintergrundbild + halbtransparentes Overlay */
    body {
      background:
        linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), /* Overlay */
        url("about/01hintergrund.png") center / cover no-repeat; /* Bild */
      font-family: Arial, sans-serif;
      color: rgb(245, 245, 245);
    }

    /* Navigation transparent, um Overlay sichtbar zu lassen */
    nav {
      background: transparent;
      margin: 0;
      padding: 20px;
      display: flex;
      gap: 15px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    /* Content-Box halbtransparent */
    .content {
      background: rgba(0,0,0,0.5);
      padding: 40px;
      max-width: 600px;
      margin: 100px auto;
      border-radius: 10px;
    }

    /* Überschrift innerhalb Content */
    h1 {
      color: white;
      margin: 0 0 20px 0;
    }

    p {
      color: #ddd;
    }
  </style>
</head>
<body>

  <nav>
    <a href="../index.html">Startseite</a>
    <a href="index.html">Über mich</a>
    <a href="../gaming/index.html">Gaming</a>
  </nav>

  <div class="content">
    <h1>Über mich</h1>
    <p>Hier steht etwas über mich.</p>
  </div>

</body>
</html>
